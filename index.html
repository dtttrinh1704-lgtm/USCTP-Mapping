<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Cotton Supply Chain Journey Map</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    /* Animation for marker pulse effect */
    @keyframes pulse-ring {
      0% { transform: scale(0.6); opacity: 0.9; }
      80%, 100% { transform: scale(2.2); opacity: 0; }
    }
    .pulse-marker {
      position: relative;
    }
    .pulse-marker::after {
      content: '';
      position: absolute;
      top: -5px; left: -5px; right: -5px; bottom: -5px;
      border-radius: 9999px;
      background: currentColor;
      animation: pulse-ring 2.2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      z-index: -1;
    }

    /* Invisible hover buffer area to make mouse interaction effortless */
    .pin-hitbox {
      padding: 10px;
      margin: -10px;
    }

    /* Dashed flow animation along routes */
    @keyframes dashFlow {
      to {
        stroke-dashoffset: -36;
      }
    }
    .route-animated {
      animation: dashFlow 1.6s linear infinite;
    }

    /* Custom Leaflet popup styling */
    .leaflet-popup-content-wrapper {
      background: #090d16;
      color: #f8fafc;
      border-radius: 14px;
      box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.7);
      border: 1px solid #1e293b;
      padding: 0;
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 0;
      line-height: 1.4;
    }
    .leaflet-popup-tip {
      background: #090d16;
    }

    /* Ensure container stretches properly */
    #map {
      width: 100%;
      height: 100%;
      min-height: 300px;
      background-color: #0b1120;
    }

    /* Dedicated Mobile View Mode styles */
    body.mode-mobile #infoPanel {
      top: auto !important;
      left: 0.75rem !important;
      right: 0.75rem !important;
      bottom: 0.75rem !important;
      width: auto !important;
      max-width: none !important;
    }
    body.mode-mobile #speedWidget {
      top: 0.75rem !important;
      bottom: auto !important;
      right: 0.75rem !important;
    }

    /* Web View Mode forced styles */
    body.mode-web #infoPanel {
      top: 1rem !important;
      left: 1rem !important;
      right: auto !important;
      bottom: auto !important;
      width: 20rem !important;
      max-height: calc(100vh - 5.5rem) !important;
    }
    body.mode-web #speedWidget {
      bottom: 1.25rem !important;
      top: auto !important;
      right: 1.25rem !important;
    }
    body.mode-web #panelMobileHeader {
      display: none !important;
    }
    body.mode-web #panelCollapsibleBody {
      display: block !important;
    }

    /* Custom Mobile Bottom-Sheet transitions when in mobile layout */
    @media (max-width: 640px) {
      body:not(.mode-web) #infoPanel {
        top: auto;
        bottom: 0.5rem;
        left: 0.5rem;
        right: 0.5rem;
        width: auto;
      }
      body:not(.mode-web) #speedWidget {
        top: 0.75rem;
        bottom: auto;
        right: 0.75rem;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen h-[100dvh] overflow-hidden select-none">

  <!-- Header: Mode Switcher & Controls -->
  <header class="bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-3 sm:px-5 py-2 sm:py-2.5 flex items-center justify-between gap-2 z-20 shadow-lg shrink-0">
    <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
      <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 shrink-0">
        <i class="fa-solid fa-route text-xs sm:text-base"></i>
      </div>
      <div class="min-w-0">
        <h1 class="text-xs sm:text-sm font-bold tracking-tight text-white flex items-center gap-1.5 truncate">
          <span>US Cotton Journey</span>
          <span class="text-[9px] sm:text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-medium px-1.5 py-0.5 rounded-full shrink-0">T5 &rarr; T1</span>
        </h1>
        <p class="text-[10px] text-slate-400 truncate hidden md:block">Memphis &rarr; Jiangsu &rarr; Nam Dinh</p>
      </div>
    </div>

    <!-- Quick controls & View Mode Switcher -->
    <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
      <!-- Mode Switcher: Web vs Mobile -->
      <div class="bg-slate-800/90 border border-slate-700/80 p-0.5 rounded-lg flex items-center text-[10px] sm:text-xs font-semibold">
        <button id="btnModeAuto" class="px-2 py-1 rounded bg-sky-500 text-slate-950 transition flex items-center gap-1" title="Auto detect screen">
          <i class="fa-solid fa-wand-magic-sparkles text-[9px]"></i> <span class="hidden sm:inline">Auto</span>
        </button>
        <button id="btnModeWeb" class="px-2 py-1 rounded text-slate-400 hover:text-white transition flex items-center gap-1" title="Desktop Web Mode">
          <i class="fa-solid fa-desktop text-[9px]"></i> <span class="hidden sm:inline">Web</span>
        </button>
        <button id="btnModeMobile" class="px-2 py-1 rounded text-slate-400 hover:text-white transition flex items-center gap-1" title="Mobile App Mode">
          <i class="fa-solid fa-mobile-screen-button text-[9px]"></i> <span class="hidden sm:inline">Mobile</span>
        </button>
      </div>

      <button id="btnPlay" class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold text-[11px] sm:text-xs transition shadow-md flex items-center gap-1">
        <i class="fa-solid fa-play text-[10px]" id="playIcon"></i> <span id="playText" class="hidden sm:inline">Start</span>
      </button>

      <button id="btnReset" class="px-2 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-[11px] transition border border-slate-700" title="Overview">
        <i class="fa-solid fa-expand text-[10px]"></i>
      </button>

      <!-- Map Style Selector (Strictly Standard OSM & Satellite only) -->
      <select id="tileSelector" class="bg-slate-800 border border-slate-700 text-slate-200 text-[11px] rounded-lg px-2 py-1.5 outline-none focus:border-sky-500 cursor-pointer">
        <option value="osm" selected>Standard (OSM)</option>
        <option value="satellite">Satellite</option>
      </select>
    </div>
  </header>

  <!-- Main Viewport: Map + Streamlined Zero-Dead-Space Info Panel -->
  <main class="relative flex-1 w-full h-full overflow-hidden">
    <!-- Map Container -->
    <div id="map" class="w-full h-full"></div>

    <!-- Tight, Zero-Dead-Space Panel -->
    <div id="infoPanel" class="absolute top-3 left-3 z-[1000] w-[calc(100%-1.5rem)] sm:w-72 bg-slate-900/95 backdrop-blur-xl border border-slate-800 rounded-xl shadow-2xl overflow-hidden transition-all duration-300">
      
      <!-- Mobile / Compact Header Bar with toggle -->
      <div id="panelMobileHeader" class="px-3 py-2 bg-slate-800/60 border-b border-slate-800/80 flex items-center justify-between cursor-pointer select-none">
        <div class="flex items-center gap-2 min-w-0">
          <span class="relative flex h-2 w-2 shrink-0">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          <span class="text-[11px] font-bold text-slate-200 truncate">PO380048072</span>
          <span id="activeTierBadgeMini" class="text-[9px] font-bold bg-sky-500/20 text-sky-400 px-1.5 py-0.2 rounded border border-sky-500/30">T5 &rarr; T4</span>
        </div>
        <button id="panelToggleBtn" class="text-[10px] text-sky-400 font-semibold hover:text-sky-300 flex items-center gap-1">
          <span id="toggleText">Details</span> <i id="toggleIcon" class="fa-solid fa-chevron-down text-[9px] transition-transform"></i>
        </button>
      </div>

      <!-- Compact Content Body -->
      <div id="panelCollapsibleBody" class="p-3 space-y-2.5 overflow-y-auto max-h-[75vh] sm:max-h-[calc(100vh-8rem)]">
        <!-- Live Movement Leg -->
        <div class="bg-slate-950/60 border border-slate-800/80 rounded-lg p-2.5 space-y-2">
          <div class="flex items-center justify-between border-b border-slate-800/60 pb-1.5">
            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
              <i class="fa-solid fa-truck-fast text-sky-400 text-[10px]"></i> Live Movement
            </span>
            <span id="activeTierBadge" class="text-[9px] font-bold bg-sky-500/20 text-sky-400 border border-sky-500/30 px-1.5 py-0.5 rounded">T5 &rarr; T4</span>
          </div>

          <div class="space-y-1.5">
            <!-- Departure -->
            <div class="flex items-center gap-2">
              <div class="w-5 h-5 rounded bg-slate-800 border border-slate-700 text-sky-400 flex items-center justify-center shrink-0 text-[8px]">
                <i class="fa-solid fa-circle-dot"></i>
              </div>
              <div class="min-w-0 flex-1 flex items-baseline justify-between gap-1">
                <span id="statusFromTier" class="text-[11px] font-bold text-slate-200 truncate">Tier 5: Origin</span>
                <span id="statusFromPlace" class="text-[10px] text-slate-400 truncate">Tennessee, USA</span>
              </div>
            </div>

            <!-- Direction indicator -->
            <div class="flex items-center pl-2.5 -my-1 text-slate-600">
              <i class="fa-solid fa-arrow-down text-[8px] text-sky-400/80"></i>
            </div>

            <!-- Next Destination -->
            <div class="flex items-center gap-2">
              <div class="w-5 h-5 rounded bg-slate-800 border border-slate-700 text-emerald-400 flex items-center justify-center shrink-0 text-[8px]">
                <i class="fa-solid fa-location-dot"></i>
              </div>
              <div class="min-w-0 flex-1 flex items-baseline justify-between gap-1">
                <span id="statusToTier" class="text-[11px] font-bold text-slate-200 truncate">Tier 4: Ginner</span>
                <span id="statusToPlace" class="text-[10px] text-slate-400 truncate">Tennessee, USA</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Order & Product Specs (Order: PO No. -> Style No. -> Product Name) -->
        <div class="bg-slate-950/60 border border-slate-800/80 rounded-lg p-2.5 space-y-1.5 text-[10px]">
          <!-- PO No. -->
          <div class="flex items-center justify-between">
            <span class="text-[9px] uppercase font-semibold text-slate-400">PO No.</span>
            <span class="font-bold font-mono text-emerald-400 bg-emerald-400/10 border border-emerald-400/25 px-1.5 py-0.5 rounded">PO380048072</span>
          </div>

          <!-- Style No. -->
          <div class="flex items-center justify-between">
            <span class="text-[9px] uppercase font-semibold text-slate-400">Style No.</span>
            <span class="font-bold font-mono text-sky-400 bg-sky-400/10 border border-sky-400/25 px-1.5 py-0.5 rounded">1MG3058</span>
          </div>

          <!-- Product Name (Clean 1-line fit) -->
          <div class="flex items-center justify-between gap-1 pt-0.5 border-t border-slate-800/60">
            <span class="text-[9px] uppercase font-semibold text-slate-400 shrink-0">Product</span>
            <span class="font-bold text-amber-300 bg-amber-400/10 border border-amber-400/20 px-1.5 py-0.5 rounded truncate text-right text-[10px]" title="MEN'S FOCUS TECH HOODIE REMIX">
              MEN'S FOCUS TECH HOODIE REMIX
            </span>
          </div>
        </div>

        <!-- Product Image: Strict 4:5 ratio, compact, zero labels -->
        <div class="bg-slate-950/60 border border-slate-800/80 rounded-lg p-2">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-[9px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1">
              <i class="fa-solid fa-camera text-sky-400 text-[9px]"></i> Product Image
            </span>
          </div>

          <div class="w-24 sm:w-28 mx-auto relative group">
            <input type="file" id="productImgInput" accept="image/*" class="hidden">

            <!-- Empty Dropzone -->
            <div id="emptyImagePrompt" onclick="document.getElementById('productImgInput').click()" 
                 class="cursor-pointer border border-dashed border-slate-700 hover:border-sky-500 bg-slate-900/50 hover:bg-sky-500/10 rounded-lg aspect-[4/5] flex flex-col items-center justify-center p-1.5 text-center transition">
              <i class="fa-solid fa-cloud-arrow-up text-slate-400 group-hover:text-sky-400 text-sm mb-1"></i>
              <p class="text-[9px] font-medium text-slate-300">Upload Photo</p>
            </div>

            <!-- Preview Display -->
            <div id="imagePreviewBox" class="hidden relative rounded-lg overflow-hidden border border-slate-700 aspect-[4/5] group/img bg-slate-950">
              <img id="productImageElement" src="" alt="1MG3058" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-slate-950/75 opacity-0 group-hover/img:opacity-100 transition-opacity flex items-center justify-center gap-1.5">
                <button onclick="document.getElementById('productImgInput').click()" class="px-2 py-0.5 rounded bg-sky-500 text-slate-950 text-[9px] font-bold" title="Change">
                  <i class="fa-solid fa-rotate text-[8px]"></i>
                </button>
                <button onclick="removeProductImage()" class="px-2 py-0.5 rounded bg-rose-500 text-white text-[9px] font-bold" title="Remove">
                  <i class="fa-solid fa-trash text-[8px]"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Speed Adjustment Widget -->
    <div id="speedWidget" class="absolute bottom-4 right-4 z-[999] bg-slate-900/90 backdrop-blur-md border border-slate-800 px-2.5 py-1.5 rounded-lg shadow-xl flex items-center gap-1.5">
      <span class="text-[10px] text-slate-400 font-medium">Speed:</span>
      <button class="speed-btn px-2 py-0.5 text-[10px] rounded bg-sky-500/20 text-sky-400 font-semibold border border-sky-500/30" data-speed="0.5">0.5x</button>
      <button class="speed-btn px-2 py-0.5 text-[10px] rounded bg-slate-800 text-slate-400 hover:text-white" data-speed="1">1x</button>
      <button class="speed-btn px-2 py-0.5 text-[10px] rounded bg-slate-800 text-slate-400 hover:text-white" data-speed="2">2x</button>
    </div>
  </main>

  <script>
    // Supply Chain Nodes: T5 -> T4 -> T3 -> T2 -> T1
    const STOPS = [
      {
        id: "origin",
        tier: "Tier 5: Origin",
        tag: "Tier 5 (T5)",
        role: "Raw Cotton Farming",
        company: "US Cotton Protocol",
        location: "Memphis, Tennessee, USA",
        coords: [35.7500, -88.8200], // Spaced eastward in West Tennessee cotton belt
        details: "Origin: Seed cotton farming.",
        color: "#f59e0b",
        icon: "fa-seedling"
      },
      {
        id: "ginner",
        tier: "Tier 4: Ginner",
        tag: "Tier 4 (T4)",
        role: "Cotton Ginning Facility",
        company: "US Cotton Protocol",
        location: "Memphis, Tennessee, USA",
        coords: [35.0800, -90.1500], // Memphis logistics & river port ginning hub
        details: "Ginning: Seed separation, lint cleaning, conditioning, PBI labeling and bale packaging.",
        color: "#f97316",
        icon: "fa-boxes-packing"
      },
      {
        id: "spinner",
        tier: "Tier 3: Spinner",
        tag: "Tier 3 (T3)",
        role: "Yarn Spinning Mill",
        company: "JIANGSU YUEDA COTTON SPINNING CO., LTD.",
        location: "Jiangsu, China",
        coords: [33.7200, 120.3500], // North Jiangsu coastal spinning cluster
        details: "Spinning: Converting raw cotton bales into fine-count combed and carded ring-spun yarn.",
        color: "#6366f1",
        icon: "fa-industry"
      },
      {
        id: "textile",
        tier: "Tier 2: Fabric Mill",
        tag: "Tier 2 (T2)",
        role: "Weaving & Dyeing",
        company: "Changzhou Yuyuang Textile Ltd.",
        location: "Changzhou, Jiangsu, China",
        coords: [31.5500, 119.7200], // South Jiangsu / Taihu textile cluster (clearly separated from Yancheng)
        details: "Fabric Mill: Warp preparation, circular knitting / weaving, and finishing treatment.",
        color: "#a855f7",
        icon: "fa-scroll"
      },
      {
        id: "garment",
        tier: "Tier 1: Garment Factory",
        tag: "Tier 1 (T1)",
        role: "Apparel Manufacturing",
        company: "Youngone Corporation",
        location: "Nam Dinh, Vietnam",
        coords: [20.4200, 106.1683], // Nam Dinh
        details: "Garment Factory: Pattern cutting, sewing assembly, finished garment QC, and retail packing.",
        color: "#14b8a6",
        icon: "fa-shirt"
      }
    ];

    // Initialize Leaflet Map
    const map = L.map('map', {
      center: [30, 20],
      zoom: 3,
      minZoom: 2,
      maxZoom: 12,
      zoomControl: false
    });

    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    // Free tile layer options (OSM default, Satellite alternative)
    const tileLayers = {
      osm: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }),
      satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri &copy; Earthstar Geographics',
        maxZoom: 18
      })
    };

    let currentTileLayer = tileLayers.osm.addTo(map);

    const tileSelector = document.getElementById('tileSelector');
    if (tileSelector) {
      tileSelector.value = 'osm';
      tileSelector.addEventListener('change', (e) => {
        map.removeLayer(currentTileLayer);
        currentTileLayer = tileLayers[e.target.value] || tileLayers.osm;
        currentTileLayer.addTo(map);
      });
    }

    // Function to calculate smooth, high-fidelity curved arc (Direct Eastbound / Transcontinental)
    function createCurvedPath(startCoord, endCoord, bendFactor = 0.25, steps = 100, isTransAtlanticEurasia = false) {
      const lat1 = startCoord[0];
      const lng1 = startCoord[1];
      const lat2 = endCoord[0];
      const lng2 = endCoord[1];

      let targetLng = lng2;
      // When flying eastward from USA (-90) to China (+120) across Atlantic & Eurasia
      if (isTransAtlanticEurasia && lng1 < 0 && lng2 > 0) {
        targetLng = lng2; // Direct eastward positive traversal across 0° prime meridian
      }

      const points = [];
      const dLat = lat2 - lat1;
      const dLng = targetLng - lng1;
      const chordDist = Math.sqrt(dLat * dLat + dLng * dLng);

      // Arc apex calculation
      let controlLat, controlLng;
      if (isTransAtlanticEurasia) {
        // High North Atlantic / Eurasian Great-Circle sweeping gracefully across Greenland/Scandinavia
        controlLat = Math.max(lat1, lat2) + 28;
        controlLng = (lng1 + targetLng) / 2;
      } else {
        const normLat = -dLng / (chordDist || 1);
        const normLng = dLat / (chordDist || 1);
        const arcHeight = chordDist * bendFactor;
        controlLat = (lat1 + lat2) / 2 + normLat * arcHeight;
        controlLng = (lng1 + targetLng) / 2 + normLng * arcHeight;
      }

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        // Quadratic Bézier trajectory
        const lat = (1 - t) * (1 - t) * lat1 + 2 * (1 - t) * t * controlLat + t * t * lat2;
        let lng = (1 - t) * (1 - t) * lng1 + 2 * (1 - t) * t * controlLng + t * t * targetLng;

        points.push([lat, lng]);
      }
      return points;
    }

    // High-curvature segments: Memphis direct to China across Atlantic/Eurasia without ocean-only Pacific detour
    const seg1 = createCurvedPath(STOPS[0].coords, STOPS[1].coords, 0.45, 30);  // T5 Origin -> T4 Ginner (Memphis local)
    const seg2 = createCurvedPath(STOPS[1].coords, STOPS[2].coords, 0.32, 160, true); // T4 Ginner (Memphis) -> T3 Spinner (Jiangsu, China) direct Great-Circle Arc
    const seg3 = createCurvedPath(STOPS[2].coords, STOPS[3].coords, 0.50, 40);  // T3 Spinner -> T2 Fabric Mill (Jiangsu regional)
    const seg4 = createCurvedPath(STOPS[3].coords, STOPS[4].coords, 0.28, 80);  // T2 Fabric Mill -> T1 Garment (China -> Vietnam)

    const routeSegments = [seg1, seg2, seg3, seg4];

    // Combine all segments into one continuous route
    const fullRouteCoords = [
      ...seg1,
      ...seg2.slice(1),
      ...seg3.slice(1),
      ...seg4.slice(1)
    ];

    // Draw glowing curved polylines
    const legColors = ['#f59e0b', '#38bdf8', '#818cf8', '#14b8a6'];
    routeSegments.forEach((seg, idx) => {
      // Glow background line
      L.polyline(seg, {
        color: legColors[idx],
        weight: 3,
        opacity: 0.35,
        dashArray: '4, 8'
      }).addTo(map);

      // Neon dash flowing line
      L.polyline(seg, {
        color: legColors[idx],
        weight: 3.5,
        opacity: 0.9,
        dashArray: '10, 15',
        className: 'route-animated'
      }).addTo(map);
    });

    // Tier Markers with Click Popups
    STOPS.forEach((stop) => {
      const customIcon = L.divIcon({
        className: 'custom-pin',
        html: `
          <div class="pin-hitbox flex items-center justify-center">
            <div style="color: ${stop.color};" class="pulse-marker flex items-center justify-center w-8 h-8 rounded-full bg-slate-900 border-2 border-current shadow-xl text-xs hover:scale-125 transition-transform duration-200 cursor-pointer">
              <i class="fa-solid ${stop.icon}"></i>
            </div>
          </div>
        `,
        iconSize: [48, 48],
        iconAnchor: [24, 24]
      });

      const marker = L.marker(stop.coords, { icon: customIcon }).addTo(map);

      // Clean, rich modal card popup
      const popupHtml = `
        <div class="w-56 sm:w-64 p-3.5 sm:p-4 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-[9px] sm:text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full" style="background-color: ${stop.color}20; color: ${stop.color}; border: 1px solid ${stop.color}40;">
              ${stop.tag}
            </span>
            <span class="text-[9px] sm:text-[10px] text-slate-400 font-mono">${stop.role}</span>
          </div>
          <div>
            <h3 class="text-xs sm:text-sm font-bold text-white leading-tight">${stop.company}</h3>
            <div class="text-[11px] sm:text-xs text-sky-400 flex items-center gap-1 mt-0.5">
              <i class="fa-solid fa-location-dot text-[10px]"></i>
              <span>${stop.location}</span>
            </div>
          </div>
          <p class="text-[11px] sm:text-xs text-slate-300 leading-relaxed border-t border-slate-800 pt-1.5">
            ${stop.details}
          </p>
        </div>
      `;
      marker.bindPopup(popupHtml, { maxWidth: 280, closeButton: false, offset: [0, -10] });

      // Hover and touch tap to display details
      marker.on('mouseover', function () {
        this.openPopup();
      });
      marker.on('mouseout', function () {
        this.closePopup();
      });

      // Click / Touch to focus on marker
      marker.on('click', () => {
        map.flyTo(stop.coords, 6, { duration: 1.2 });
      });
    });

    // Cotton Boll SVG for moving marker
    const cottonBollSvg = `
      <svg viewBox="0 0 48 48" class="w-full h-full drop-shadow-[0_4px_10px_rgba(255,255,255,0.45)]" xmlns="http://www.w3.org/2000/svg">
        <path d="M24 40 C20 44 14 39 12 33 C18 36 22 34 24 30 C26 34 30 36 36 33 C34 39 28 44 24 40 Z" fill="#855938" />
        <path d="M12 28 C6 24 9 17 14 18 C11 22 14 26 18 26 C15 28 13 28 12 28 Z" fill="#6d4629" />
        <path d="M36 28 C42 24 39 17 34 18 C37 22 34 26 30 26 C33 28 35 28 36 28 Z" fill="#6d4629" />
        <circle cx="24" cy="20" r="10.5" fill="#e2e8f0" />
        <circle cx="17" cy="21" r="8.5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
        <circle cx="31" cy="21" r="8.5" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
        <circle cx="24" cy="14" r="8" fill="#ffffff" stroke="#f1f5f9" stroke-width="0.8" />
        <circle cx="24" cy="23" r="7.5" fill="#ffffff" />
        <path d="M21 16 Q24 19 21 23" stroke="#cbd5e1" stroke-width="0.8" fill="none" stroke-linecap="round" />
        <path d="M27 16 Q24 19 27 23" stroke="#cbd5e1" stroke-width="0.8" fill="none" stroke-linecap="round" />
      </svg>
    `;

    const cottonIcon = L.divIcon({
      className: 'cotton-marker',
      html: `
        <div class="relative flex items-center justify-center w-10 h-10 -ml-1 -mt-1 transition-transform hover:scale-125">
          <div class="absolute inset-0 rounded-full bg-white/25 blur-sm animate-ping"></div>
          ${cottonBollSvg}
        </div>
      `,
      iconSize: [40, 40],
      iconAnchor: [20, 20]
    });

    const cargoMarker = L.marker(fullRouteCoords[0], { icon: cottonIcon, zIndexOffset: 1000 }).addTo(map);

    // Cumulative indices for stage transitions
    const cumLengths = [
      seg1.length,
      seg1.length + seg2.length - 1,
      seg1.length + seg2.length + seg3.length - 2,
      fullRouteCoords.length
    ];

    let animationFrameId = null;
    let isPlaying = false;
    let progress = 0;
    let speedMultiplier = 0.5; // Starts at 0.5x
    const totalPoints = fullRouteCoords.length;

    // Elements for left status card
    const elActiveBadge = document.getElementById('activeTierBadge');
    const elActiveBadgeMini = document.getElementById('activeTierBadgeMini');
    const elFromTier = document.getElementById('statusFromTier');
    const elFromPlace = document.getElementById('statusFromPlace');
    const elToTier = document.getElementById('statusToTier');
    const elToPlace = document.getElementById('statusToPlace');

    function updateStatusBox(currentPointIndex) {
      let activeLeg = 0;

      for (let i = 0; i < cumLengths.length; i++) {
        const start = i === 0 ? 0 : cumLengths[i - 1];
        const end = cumLengths[i] - 1;
        if (currentPointIndex >= start && currentPointIndex <= end) {
          activeLeg = i;
          break;
        }
      }

      const fromNode = STOPS[activeLeg];
      const toNode = STOPS[activeLeg + 1];

      const tagText = `${fromNode.tag.split(' ')[0]} ➔ ${toNode.tag.split(' ')[0]}`;
      if (elActiveBadge) elActiveBadge.innerText = tagText;
      if (elActiveBadgeMini) elActiveBadgeMini.innerText = tagText;
      
      if (elFromTier) elFromTier.innerText = `${fromNode.tier.split(':')[0]} (${fromNode.company})`;
      if (elFromPlace) elFromPlace.innerText = fromNode.location;

      if (elToTier) elToTier.innerText = `${toNode.tier.split(':')[0]} (${toNode.company})`;
      if (elToPlace) elToPlace.innerText = toNode.location;
    }

    function animateMovement() {
      if (!isPlaying) return;

      progress += 0.0012 * speedMultiplier;
      if (progress >= 1) progress = 0;

      const indexFloat = progress * (totalPoints - 1);
      const currentIndex = Math.floor(indexFloat);
      const nextIndex = Math.min(currentIndex + 1, totalPoints - 1);
      const subRatio = indexFloat - currentIndex;

      const p1 = fullRouteCoords[currentIndex];
      const p2 = fullRouteCoords[nextIndex];

      const currentLat = p1[0] + (p2[0] - p1[0]) * subRatio;
      const currentLng = p1[1] + (p2[1] - p1[1]) * subRatio;

      cargoMarker.setLatLng([currentLat, currentLng]);
      updateStatusBox(currentIndex);

      animationFrameId = requestAnimationFrame(animateMovement);
    }

    // Play / Pause controls
    const btnPlay = document.getElementById('btnPlay');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');

    btnPlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playIcon.classList.replace('fa-play', 'fa-pause');
        playText.innerText = "Pause";
        animateMovement();
      } else {
        playIcon.classList.replace('fa-pause', 'fa-play');
        playText.innerText = "Resume";
        cancelAnimationFrame(animationFrameId);
      }
    });

    // Overview reset
    document.getElementById('btnReset').addEventListener('click', () => {
      const bounds = L.latLngBounds(fullRouteCoords);
      map.fitBounds(bounds, { padding: [40, 40] });
    });

    // Panel collapse / expand toggle
    const panelMobileHeader = document.getElementById('panelMobileHeader');
    const panelCollapsibleBody = document.getElementById('panelCollapsibleBody');
    const toggleText = document.getElementById('toggleText');
    const toggleIcon = document.getElementById('toggleIcon');
    let isPanelOpen = true;

    function setPanelState(open) {
      isPanelOpen = open;
      if (open) {
        panelCollapsibleBody.style.display = 'block';
        if (toggleText) toggleText.innerText = 'Hide';
        if (toggleIcon) toggleIcon.style.transform = 'rotate(180deg)';
      } else {
        panelCollapsibleBody.style.display = 'none';
        if (toggleText) toggleText.innerText = 'Details';
        if (toggleIcon) toggleIcon.style.transform = 'rotate(0deg)';
      }
    }

    if (panelMobileHeader) {
      panelMobileHeader.addEventListener('click', () => {
        setPanelState(!isPanelOpen);
      });
    }

    // Explicit Mode Switcher: Auto, Web, Mobile
    const btnModeAuto = document.getElementById('btnModeAuto');
    const btnModeWeb = document.getElementById('btnModeWeb');
    const btnModeMobile = document.getElementById('btnModeMobile');

    function applyViewMode(mode) {
      document.body.classList.remove('mode-web', 'mode-mobile');
      [btnModeAuto, btnModeWeb, btnModeMobile].forEach(btn => {
        btn.classList.remove('bg-sky-500', 'text-slate-950');
        btn.classList.add('text-slate-400');
      });

      if (mode === 'web') {
        document.body.classList.add('mode-web');
        btnModeWeb.classList.add('bg-sky-500', 'text-slate-950');
        btnModeWeb.classList.remove('text-slate-400');
        setPanelState(true);
      } else if (mode === 'mobile') {
        document.body.classList.add('mode-mobile');
        btnModeMobile.classList.add('bg-sky-500', 'text-slate-950');
        btnModeMobile.classList.remove('text-slate-400');
        setPanelState(false);
      } else {
        // Auto mode based on window size
        btnModeAuto.classList.add('bg-sky-500', 'text-slate-950');
        btnModeAuto.classList.remove('text-slate-400');
        if (window.innerWidth < 640) {
          setPanelState(false);
        } else {
          setPanelState(true);
        }
      }
      setTimeout(() => map.invalidateSize(), 150);
    }

    btnModeAuto.addEventListener('click', () => applyViewMode('auto'));
    btnModeWeb.addEventListener('click', () => applyViewMode('web'));
    btnModeMobile.addEventListener('click', () => applyViewMode('mobile'));

    // Speed controls
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.speed-btn').forEach(b => {
          b.classList.remove('bg-sky-500/20', 'text-sky-400', 'border', 'border-sky-500/30');
          b.classList.add('bg-slate-800', 'text-slate-400');
        });
        e.target.classList.add('bg-sky-500/20', 'text-sky-400', 'border', 'border-sky-500/30');
        e.target.classList.remove('bg-slate-800', 'text-slate-400');
        speedMultiplier = parseFloat(e.target.dataset.speed);
      });
    });

    // Product Picture Upload Logic (Supports localStorage caching)
    const productImgInput = document.getElementById('productImgInput');
    const emptyImagePrompt = document.getElementById('emptyImagePrompt');
    const imagePreviewBox = document.getElementById('imagePreviewBox');
    const productImageElement = document.getElementById('productImageElement');

    function displayProductImage(dataUrl) {
      productImageElement.src = dataUrl;
      emptyImagePrompt.classList.add('hidden');
      imagePreviewBox.classList.remove('hidden');
    }

    function removeProductImage() {
      productImgInput.value = '';
      productImageElement.src = '';
      imagePreviewBox.classList.add('hidden');
      emptyImagePrompt.classList.remove('hidden');
      localStorage.removeItem('saved_product_image_1MG3058');
    }

    if (productImgInput) {
      productImgInput.addEventListener('change', function(e) {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(evt) {
            const dataUrl = evt.target.result;
            displayProductImage(dataUrl);
            try {
              localStorage.setItem('saved_product_image_1MG3058', dataUrl);
            } catch (err) {
              // Handle quota exceeded if file is excessively large
            }
          };
          reader.readAsDataURL(file);
        }
      });
    }

    // Window load handler
    window.onload = function() {
      map.invalidateSize();
      const bounds = L.latLngBounds(fullRouteCoords);
      const isMobile = window.innerWidth < 640;
      map.fitBounds(bounds, { padding: isMobile ? [25, 25] : [45, 45] });

      // Default panel state based on device
      if (isMobile) {
        setPanelState(false);
      } else {
        setPanelState(true);
      }

      updateStatusBox(0);

      // Restore saved product picture from localStorage if present
      const cachedImg = localStorage.getItem('saved_product_image_1MG3058');
      if (cachedImg) {
        displayProductImage(cachedImg);
      }

      setTimeout(() => {
        map.invalidateSize();
      }, 300);

      setTimeout(() => {
        btnPlay.click();
      }, 1000);
    };

    window.addEventListener('resize', () => {
      map.invalidateSize();
    });
  </script>
</body>
</html>
